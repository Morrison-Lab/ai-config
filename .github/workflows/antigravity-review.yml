# Active caller for Morrison-Lab/gha's reusable Antigravity PR review workflow.
name: Antigravity Code Review

on:
  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
      mode:
        description: 'Operational mode: code-review, security-audit, or test-generation'
        required: false
        default: 'code-review'
        type: choice
        options:
          - code-review
          - security-audit
          - test-generation

concurrency:
  group: antigravity-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '@agy') || contains(github.event.comment.body, '@antigravity')) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: Morrison-Lab/gha/.github/workflows/antigravity-code-review.yml@v2
    with:
      mode: ${{ inputs.mode || 'code-review' }}
      pr-number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || '' }}
      model: ''
      trigger-policy: 'on-request'
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
