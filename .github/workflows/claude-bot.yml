name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Deliberately NOT `opened`: the upstream gate in claude.yml is a plain
  # substring match on the bot mention, with no regard for code-span
  # formatting, so filing an issue that merely *discusses* the bot dispatched
  # a full agent run (#682 -> #683). Summon the agent explicitly instead:
  # assign the issue (the upstream gate still requires the mention in the
  # body or title), or mention the bot in a comment.
  issues:
    types: [assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    uses: d-morrison/gha/.github/workflows/claude.yml@v1
    secrets: inherit
    with:
      setup-r: false
      eager-pr: true
      review-workflow-file: claude-review.yml
