# The unattended half of the weekly backlog triage pass
# (shared/workflow/triage-backlog.md, "The unattended half: labels only").
#
# Gives each open issue with no priority label the label the plan proposes for
# it (P1, P2 or P3), and closes nothing. An issue the plan would close (junk or
# a duplicate) is left unlabelled for the attended `triage` skill, where a
# reader reviews each close. Also reports the open count, against the ceiling
# in the repository variable ISSUE_CEILING when that variable is set.
#
# This covers ai-config only. The reusable gha workflow that would give every
# lab repo the same pass is ai-config#3147.
name: Triage backlog (labels only)

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the label commands without running them.
        type: boolean
        default: false
  schedule:
    - cron: '0 7 * * 1' # Weekly on Monday at 07:00 UTC

permissions: {}

concurrency:
  group: triage-backlog
  cancel-in-progress: false

jobs:
  label:
    name: Label unprioritized issues
    runs-on: ubuntu-latest
    if: github.repository == 'Morrison-Lab/ai-config'
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check that the priority labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The script adds labels and creates none, so a missing label would
          # stop the run part-way through the edits.
          for label in P1 P2 P3; do
            if ! gh api "repos/$REPO/labels/$label" --silent; then
              echo "::error::The label $label is missing from $REPO, or could not be read. Create it, then run this again."
              exit 1
            fi
          done

      - name: Label the open issues the plan gives a priority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_CEILING: ${{ vars.ISSUE_CEILING }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # --dry-run only has an effect together with --apply: apply_plan()
          # in scripts/triage-backlog.py prints each command in place of
          # running it. So a dry run passes both flags.
          args=(-R "$REPO" --apply --labels-only)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$ISSUE_CEILING" ]; then
            args+=(--ceiling "$ISSUE_CEILING")
          fi
          # The plan (stdout) goes to the log, with each label command after it
          # on a dry run only: a real run prints no commands, only what `gh`
          # prints for each edit. The summary
          # (stderr) goes to a file first, so the next step can copy it into
          # the job summary whether this step passed or failed.
          rc=0
          python3 scripts/triage-backlog.py "${args[@]}" \
            2> "$RUNNER_TEMP/triage-summary.txt" || rc=$?
          cat "$RUNNER_TEMP/triage-summary.txt" >&2
          exit "$rc"

      - name: Copy the summary into the job summary
        if: always()
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/triage-summary.txt"
          if [ ! -s "$summary" ]; then
            # An earlier step failed, or the labelling step wrote nothing.
            echo "No summary was written."
            {
              echo '### Backlog triage (labels only)'
              echo
              echo 'The run stopped before the labelling step wrote a summary. Read the log for the error.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Backlog triage (labels only)'
            echo
            echo '```text'
            cat "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A run over the ceiling still passes, so say so where a reader of
          # the run list sees it.
          over=$(grep -m 1 'over the ceiling of' "$summary" || true)
          if [ -n "$over" ]; then
            echo "::warning::$over"
          fi
