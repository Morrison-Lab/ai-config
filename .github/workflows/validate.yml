name: validate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Populate shared/sembr-skills so the marketplace plugin source is a
          # real directory rather than an empty placeholder; without this, the
          # plugin-source check below can only ever report the warning branch.
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml==6.0.2
      - name: Validate skills & manifests
        run: python3 scripts/validate-skills.py
      - name: Check markdown links
        run: python3 scripts/check-links.py
      - name: Check vendored drift
        run: python3 scripts/check-vendored-drift.py
      - name: Check tui-alloc README defaults
        run: python3 scripts/check-tui-alloc-readme.py
      - name: Check markdown (.md) style
        run: npx --yes markdownlint-cli2@0.22.1   # node is preinstalled on ubuntu runners; config in .markdownlint-cli2.jsonc
      - name: Run skills-validator tests
        run: python3 scripts/test_validate_skills.py
      - name: Run check-pr-fully-clean tests
        run: python3 scripts/test_check_pr_fully_clean.py
      - name: Run check-pr-body-figures tests
        run: python3 scripts/test_check_pr_body_figures.py
      - name: Run semantic-line-break tool tests
        run: python3 scripts/test_slb.py
      - name: Run memory-file-size check tests
        run: python3 scripts/test_check_memory_file_size.py
      - name: Run tui-alloc README check tests
        run: python3 scripts/test_check_tui_alloc_readme.py
      - name: Run near-duplicate detector tests
        # The detector itself is a find-overlap tool rather than a gate, so it
        # is not run here -- a corpus growing a near-duplicate pair is a
        # reading prompt, not a build failure. Its tests do run, because two
        # of them pin measured corpus facts (alias stubs score low;
        # conceptually adjacent pairs score low) that the script's documented
        # scope rests on.
        run: python3 scripts/test_find_near_duplicates.py
      - name: Run install-integrity check tests
        # Only the tests run here. check-install.py itself compares against a
        # consumer directory (~/.claude) that no CI runner has, so on a runner
        # it correctly reports "nothing installed to check" and proves nothing.
        run: |
          python3 scripts/test_check_install.py
          python3 scripts/test_check_harness_installs.py
          python3 scripts/test_check_harness_ignores.py
      - name: Check harness ignore files cover local residue
        run: python3 scripts/check-harness-ignores.py
      - name: Run plugin-overlap detector tests
        # Only the tests run here. check-plugin-overlap.py itself inspects a
        # consumer directory (~/.claude) plus its settings.json, which no CI
        # runner has, so on a runner it correctly reports nothing examined and
        # proves nothing (ai-config#1409).
        run: python3 scripts/test_plugin_overlap.py
      - name: Run Codex skill-install tests
        # Bootstrap must choose either an ai-config Codex plugin or its bare
        # wrappers. Installing both doubles the routing catalog and can exceed
        # the skill-listing context budget.
        run: |
          python3 scripts/test_codex_plugin_enabled.py
          python3 scripts/test_bootstrap_codex_plugin.py
      - name: Run Cursor skill-install tests
        # Bootstrap must not stack a Cursor plugin with ~/.cursor/skills links.
        run: |
          python3 scripts/test_cursor_plugin_enabled.py
          python3 scripts/test_bootstrap_cursor_plugin.py
          python3 scripts/test_cursor_rules_sync.py
      - name: Run PR-monitor installer tests
        # Only the tests run here. install-pr-monitor.py itself installs a
        # daemon under the operator's systemd/cron, which a CI runner must
        # never do.
        run: python3 scripts/test_install_pr_monitor.py
      - name: Run token-rotation tool tests
        # Only the tests run here. rotate-claude-token.py itself mutates
        # repository secrets across the estate, so it is a local operator tool
        # that must never run unattended in CI (ai-config#952).
        run: python3 scripts/test_rotate_claude_token.py
      - name: Run PR-sweep tests
        # Only the tests run here. pr-sweep.py itself queries the GitHub API
        # via `gh`, which a runner cannot do unauthenticated, so running the
        # sweep in CI would prove nothing. Its classification logic is pure
        # over the GraphQL payload shape, so the tests cover it offline.
        run: python3 scripts/test_pr_sweep.py
      - name: Run context-closure tests
        run: python3 scripts/test_check_context_closure.py
      - name: Run ai-session MWC grant tests
        # The merge guard's only scoped authorization path runs through
        # ai-session.sh's MWC marker, and it shipped with no test at all --
        # which is how ai-config#1279's check-mwc defects went unnoticed. Runs
        # against a throwaway git repo, so it never touches a real registry.
        run: python3 scripts/test_ai_session.py
      - name: Run shell-form comparison tests
        # Spawns a real bash, deliberately: the tool's whole value is that it
        # applies exactly ONE shell layer, and only a real run can show that.
        run: python3 scripts/test_compare_shell_forms.py
      - name: Run enforcement-hook tests
        # The hooks/ guards enforce corpus rules but their test-<name>.py files
        # ran nowhere until now (ai-config#1065). This runner pairs each test
        # with its subject AND flags any hook missing a test (ai-config#1080),
        # so a tested guard cannot regress and an untested one cannot hide.
        run: python3 scripts/test_hooks.py
      - name: Check the hook catalog against hooks.json
        # test_hooks.py above compares hooks against their TESTS. Nothing
        # compared them against their BINDINGS or against the README table a
        # human reads, so those drifted apart in both directions
        # (ai-config#1206) -- and the drift grew by one entry in the ten days
        # between the issue being filed and fixed, which is why this gates
        # rather than being reconciled once. The dangerous direction is a
        # README row for an unregistered hook: an inert guard and a guard with
        # nothing to block look identical, since neither ever produces output.
        run: python3 scripts/check-hook-catalog.py
      - name: Run hook-catalog check tests
        run: python3 scripts/test_check_hook_catalog.py
      - name: Check hook output shape (warn-only hooks emit systemMessage)
        run: python3 scripts/check-hook-output-shape.py
      - name: Run hook-output-shape check tests
        run: python3 scripts/test_check_hook_output_shape.py
      - name: Measure the auto-loaded context closure (advisory) and gate its hard caps
        # The BUDGET half reports rather than gates, and deliberately so:
        # this repo is currently ~4x the shipped budget (ai-config#897), so a
        # blocking form would be red on every PR and would train everyone to
        # ignore it -- the failure mode algorithmatize-checks warns about.
        #
        # The root file's CHARACTER CAP is the exception, and gates without
        # --strict (ai-config#897, #1258). It is not our budget but the
        # harness's hard limit on the auto-loaded CLAUDE.md, past which that
        # file is not loaded whole -- a failure that shows up nowhere else,
        # since a rule that never loaded looks exactly like one that loaded
        # and was obeyed. The cry-wolf objection above does not transfer:
        # this one is a cliff rather than a heuristic, it can only be crossed
        # by a PR that adds to CLAUDE.md, and the run prints the remaining
        # headroom every time so the wall is visible before it is hit.
        #
        # The value here is the NUMBER in the log on each run. The closure
        # grew ~12x in a month with nothing reporting it, because a per-file
        # line count cannot see a total and the gitlink diff of a pin bump is
        # one line. A trend line on every PR is what was missing.
        #
        # The PER-FRAGMENT cap is the second exception, added in
        # ai-config#1398, and gates without --strict for the same reason as
        # the root cap: the budget above governs the closure's total and the
        # root cap governs one file, so nothing constrained an individual
        # @shared/... fragment and the corpus grew one justified-looking
        # fragment at a time. The cry-wolf objection does not transfer here
        # either -- the default is a round 100 KB policy line that no
        # fragment currently reaches, and the run prints the examined count
        # and every breach's headroom on each PR.
        #
        # It still exits non-zero on a dangling ANCHORED import (one written
        # on its own line), which is a defect rather than a size finding.
        # An unresolved INLINE @token is reported but does not fail, since
        # most are prose -- see the script's docstring.
        run: python3 scripts/check-context-closure.py
      - name: Report this PR's own context-closure delta (advisory)
        # ai-config#1373. The step above reports the closure's LEVEL against a
        # budget; this reports what THIS branch did to it. Those are different
        # questions, and only the second is attributable to an author: the
        # total is a sum nobody owns, while a delta names the PR that moved it.
        #
        # Advisory by construction, and deliberately not gated. A fragment that
        # grows because it earned the words is the normal case, so failing on
        # growth would fire on most PRs and train everyone to ignore it -- the
        # cry-wolf failure `shared/workflow/algorithmatize-checks.md` warns
        # about. Reporting the number where a reviewer already looks is the
        # whole intervention.
        #
        # `|| true` is not swallowing a failure here: the script's own baseline
        # mode never exits non-zero for a delta, so the only statuses it can
        # return are usage errors (2) on a rev this runner cannot resolve --
        # a shallow clone, a force-push -- which must not redden an unrelated
        # PR. The delta itself is in the log either way.
        #
        # The base has to be fetched explicitly. `actions/checkout` above sets
        # no `fetch-depth`, so it clones at depth 1 and `origin/<base>` does
        # not resolve at all -- the step would print "cannot resolve" on every
        # run and read as working. Fetching here rather than deepening the
        # shared checkout keeps the clone cost on the one step that needs it.
        #
        # The rev used is echoed rather than assumed. A merge base is the right
        # subject (it asks what this branch added), but a bounded fetch may not
        # reach one, and the tip fallback answers a slightly different question
        # -- it also counts whatever the base gained since this branch diverged,
        # which reads as a shrink. Saying which one ran is what keeps the number
        # interpretable instead of merely present.
        run: |
          set -uo pipefail
          BASE="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --quiet --depth=50 origin "$BASE" || true
          if REV="$(git merge-base HEAD FETCH_HEAD 2>/dev/null)"; then
            echo "baseline: merge base with origin/$BASE ($REV)"
          elif git rev-parse --verify --quiet FETCH_HEAD >/dev/null; then
            REV=FETCH_HEAD
            echo "baseline: tip of origin/$BASE (no merge base within 50 commits)"
          else
            echo "baseline: origin/$BASE unreachable; skipping the delta report"
            exit 0
          fi
          python3 scripts/check-context-closure.py --baseline "$REV" || true
      - name: Check for oversized memory files (advisory)
        # Non-blocking (ai-config#695): memory files are read on demand, so
        # length is a real per-use cost -- but crossing the threshold is a
        # prompt to consider splitting, not a defect that should block an
        # unrelated PR. See the script's docstring for the threshold's
        # rationale.
        run: python3 scripts/check-memory-file-size.py
      - name: Run stale-record check tests
        run: python3 scripts/test_check_stale_records.py
      - name: Check for stale and orphaned records (advisory)
        # ai-config#1544. Non-blocking, and for two separate reasons.
        #
        # The ORPHAN bucket is a reading prompt rather than a defect: a
        # markdown file with no inbound link or import is usually a session
        # notebook or a handoff doc whose content has been folded elsewhere,
        # and deciding that is a judgment call. Gating on it would fire on
        # every PR that adds a genuinely new top-level document.
        #
        # The AGE bucket cannot gate here at all, and the script says so in
        # its own output rather than reporting a silent zero. Ages come from
        # `git log`, and `actions/checkout` above clones at depth 1, so every
        # file reads as no older than the shallowest fetched commit -- the
        # bucket is a fact about the clone rather than about the corpus. It
        # is emitted as `age_informative: false` in --json.
        #
        # The value here is the same as the context-closure step's: the
        # NUMBERS in the log on each run, and specifically the orphan list,
        # which is a link-graph fact the shallow clone does not affect.
        run: python3 scripts/check-stale-records.py
      - name: Check Quarto (.qmd) prose style
        uses: Morrison-Lab/gha/lint-qmd@cba62aa00856c40111cd976d563e1ebe748f3f9a # gha#280

  new-line-breaks:
    # Diff-scoped, blocking (ai-config#682, ported to gha#300): MD013 is off
    # repo-wide (see .markdownlint-cli2.jsonc) because most of the corpus has
    # drifted from the last semantic-line-breaks reformat. This only flags
    # lines a PR itself adds, so it can't reflag that drift.
    #
    # No event_name guard: the reusable workflow's own base-ref input
    # (github.event.pull_request.base.sha on PRs, '' otherwise) already
    # makes a non-PR run (e.g. push to main) skip cleanly rather than
    # scanning the whole tree -- see check-new-line-breaks.yml gha#300.
    uses: Morrison-Lab/gha/.github/workflows/check-new-line-breaks.yml@209bfb76bd412aa10d4d56a809d791a6dc8f10df # v2, gha#300
    with:
      # This value is a git pathspec, not a shell glob: `*.md` already matches
      # at any depth (CLAUDE.md and shared/**/foo.md alike), while `**/*.md`
      # requires a directory component and so silently excludes CLAUDE.md and
      # every other root-level .md -- the action's own default is `*.md`
      # (ai-config#962).
      globs: '*.md'
      paths-ignore: 'codex-skills/**,docs/**,_site/**,.quarto/**'
      fail: true
