# Caller for Morrison-Lab/gha's reusable Claude PR review workflow.
#
# Three ways to start a review:
#   - pull_request events (opened / synchronize / ready_for_review / reopened)
#     -- the automatic review. Skipped when the pushing sender is a Bot.
#   - a `/review` comment on a PR (see dispatch-on-comment below) -- an
#     on-demand review, and the only pathway available to an agent session,
#     which the automatic path's sender gate excludes.
#   - workflow_dispatch with a pr_number -- manual, and the path claude-bot.yml
#     re-dispatches on an @claude run or trusted @claude review comment.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  # A trusted author (or an allowlisted app) commenting `/review` at the start
  # of a PR comment triggers an on-demand review of that PR. Ported from
  # Morrison-Lab/gha's own caller, which has run this job in production since
  # gha#601, with `claude[bot]` added to the login allowlist.
  #
  # This is the review-request pathway for agent sessions. A remote/web Claude
  # Code session acts under the `claude[bot]` App identity, and two independent
  # gates keep it from reaching a review any other way:
  #
  #   - The reusable workflow gates its automatic `pull_request` path on
  #     `github.event.sender.type != 'Bot'`, so a push from such a session
  #     skips every `review /` job (ai-config#3743).
  #   - A `workflow_dispatch` issued directly by `claude[bot]` does reach the
  #     reusable workflow -- its `if:` admits `workflow_dispatch`
  #     unconditionally -- but `claude-code-action` then rejects the triggering
  #     actor, because the caller's `allowed-bots` lists only
  #     `github-actions[bot]`. Measured 2026-09-18 on this repo: all four
  #     dispatched runs with `triggering_actor: claude[bot]` (35267489584,
  #     35268075963, 35312346178, 35312509759) ended `failure-kind:
  #     short-circuit`, `attempts: 1`,
  #     `total-cost-usd: 0.0000`, with the "Run Claude Code Review" step lasting
  #     35ms and skipping its own Bun install; the four dispatched runs with
  #     `triggering_actor: github-actions[bot]` checked in the same window
  #     (35311949751, 35312775441, 35312827292, 35312866850) produced a real
  #     review. `SELF_MOD` was `false` on the failures, so this is not the
  #     gha#598 workflow-restore path.
  #
  # Routing the request through a comment fixes both at once: the dispatch is
  # issued by this job under `GITHUB_TOKEN`, so the triggering actor is
  # `github-actions[bot]` -- the actor `allowed-bots` already admits -- and the
  # `pull_request` sender gate is never consulted, because the run arrives as a
  # `workflow_dispatch`.
  #
  # The tag is deliberately a slash command, NOT an `@claude ...` mention: any
  # `@claude` substring also wakes claude-bot.yml's agent, so a slash command
  # keeps this path independent of that agent -- and keeps a review from being
  # able to summon one. Nothing this workflow posts begins with `/review` (the
  # acknowledgement below opens with an emoji, and a posted review opens with
  # its own heading), so the path cannot re-enter itself.
  dispatch-on-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
      contains(fromJSON('["claude[bot]","cursor[bot]"]'), github.event.comment.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write        # dispatch this workflow via `gh workflow run`
      issues: write         # acknowledge the /review comment
      # Read the PR's head branch and changed files below. An explicit
      # permissions: block denies every unlisted scope rather than
      # defaulting it, so this is required even though a public repo's
      # PR metadata is readable by an under-scoped token (gha#612).
      pull-requests: read
    steps:
      - name: Dispatch a review for the commented PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          # Hardcoded, where gha's own copy of this job derives it from
          # `github.workflow_ref` via `parse-workflow-ref@v2`. Safe here because
          # this is a caller workflow in a fixed location rather than a reusable
          # one that can be invoked under another filename; rename this file and
          # this line has to change with it.
          WF_FILE: claude-review.yml
          # Passed via env (not inlined into the script) so the comment body is
          # a shell value, never interpreted as script -- avoids injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The job-level `if:` only does a cheap startsWith('/review') pre-filter;
          # GitHub Actions expressions can't reliably tell '/review' from
          # '/reviewer' or handle a newline/tab after the command. Enforce the real
          # match here: the body must begin with a standalone '/review' token,
          # followed by whitespace (space/tab/newline) or end-of-string.
          if [[ ! "$COMMENT_BODY" =~ ^/review([[:space:]]|$) ]]; then
            echo "Comment does not start with a standalone '/review' command; skipping dispatch."
            exit 0
          fi
          # This job never checks out the repo, so the PR's head branch has to
          # be looked up explicitly. --ref pins the dispatched run's check-runs
          # to that branch instead of the default branch workflow_dispatch
          # falls back to when no ref is given (gha#285) -- without it,
          # `require-review`'s check-run lands on the wrong commit and the PR
          # shows no verdict however well the review itself went.
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          PR_HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")
          echo "Dispatching $WF_FILE to review PR #$PR_NUMBER ($PR_BRANCH) (/review comment)."
          # A fork PR's head branch only exists in the fork, not in $REPO, so
          # --ref would fail to resolve there (gha#289). Fall back to no --ref
          # for fork PRs; the resulting check-run mis-attributes to the
          # default branch (the pre-gha#285 behavior), the lesser problem.
          REF_ARGS=(--ref "$PR_BRANCH")
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); dispatching $WF_FILE without --ref."
            REF_ARGS=()
          fi
          # When the PR edits top-level workflow YAML, omit --ref so GitHub
          # executes the default-branch caller rather than the PR head
          # (gha#598). Nested paths under workflows/scripts/ are not workflows.
          # GET .../files is capped at 3000 files, so a 200 with a short list is
          # not a complete tree; treat an incomplete listing as workflow-editing.
          changed=$(jq -r '.changed_files' <<< "$PR_JSON")
          listed=0
          if ! files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename'); then
            echo "::notice::Could not list a complete file set for PR #$PR_NUMBER; dispatching $WF_FILE without --ref so GitHub executes default-branch workflow YAML (gha#598)."
            REF_ARGS=()
          else
            if [ -n "$files" ]; then
              listed=$(printf '%s\n' "$files" | grep -c . || true)
            fi
            if [ -z "$changed" ] || [ "$changed" = "null" ] || ! [[ "$changed" =~ ^[0-9]+$ ]] || [ "$listed" -lt "$changed" ]; then
              echo "::notice::Could not list a complete file set for PR #$PR_NUMBER; dispatching $WF_FILE without --ref so GitHub executes default-branch workflow YAML (gha#598)."
              REF_ARGS=()
            elif printf '%s\n' "$files" | grep -qE '^\.github/workflows/[^/]+\.ya?ml$'; then
              echo "::notice::PR #$PR_NUMBER edits workflow files; dispatching $WF_FILE from the default branch so GitHub executes trusted workflow YAML (gha#598)."
              REF_ARGS=()
            fi
          fi
          # --repo is required: this job doesn't check out the repo, so gh has no
          # git remote to infer it from (and gh doesn't read GITHUB_REPOSITORY).
          gh workflow run "$WF_FILE" --repo "$REPO" "${REF_ARGS[@]}" -f pr_number="$PR_NUMBER"
          gh issue comment "$PR_NUMBER" --repo "$REPO" \
            --body ":mag: \`/review\` received -- dispatched a Claude review of this PR (see the [dispatch run]($RUN_URL)). The review posts as its own comment when it finishes." \
            || echo "::warning::Could not acknowledge the /review comment."

  gather-context:
    # pull_request and workflow_dispatch only; the issue_comment path is handled
    # by dispatch-on-comment above (which re-enters via workflow_dispatch).
    # Without this gate every PR comment would run this job's gh api call and
    # spawn a pointless (skipped) call of the reusable workflow.
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      prior-reviews: ${{ steps.fetch.outputs.prior-reviews }}
    steps:
      - id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch last 3 claude[bot] review comments (REST author login is "claude[bot]")
          REVIEWS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | .[-3:] |
                  .[] | "=== Review posted \(.created_at) ===\n\(.body)\n"' \
            2>/dev/null | head -c 12000 || true)
          {
            echo 'prior-reviews<<__REVIEWS_EOF__'
            echo "$REVIEWS"
            echo '__REVIEWS_EOF__'
          } >> "$GITHUB_OUTPUT"

  review:
    if: github.event_name != 'issue_comment'
    needs: gather-context
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read   # lets the reviewer read CI status (github_ci MCP server)
      checks: read    # commits/<ref>/check-runs, required by gha@v2 since gha#830
    uses: Morrison-Lab/gha/.github/workflows/claude-code-review.yml@v2
    secrets: inherit
    with:
      pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
      prompt-addendum: |
        ## Review scope

        Do not flag cosmetic raw-source line-wrapping in Markdown prose files
        (`.md`, `.qmd`). A noun phrase or sentence split across a hard wrap
        looks odd in raw source but renders identically — it is not a genuine
        prose problem. Keep flagging real prose issues: ambiguity, grammar that
        changes meaning, factual errors, or missing words.

        ## Verdict semantics

        Your verdict is a judgment about the DIFF'S CONTENT. Never condition
        it on your own review run's in-flight sibling checks, and never defer
        it to `scripts/check-pr-fully-clean.py`'s exit status: that instrument
        cannot read clean while the review it gates (this run) is still
        executing, and a prior round's status-conditioned "Needs more work"
        is not a content finding for you to inherit. Conditioning on either
        produces the permanent `Needs more work` loop tracked as
        ai-config#2475, where every re-run reproduces the blocker it is
        waiting out. So: if the diff has no content defects and no check has
        actually FAILED, say **Ready for merge** -- checks that are merely
        queued or in progress alongside you are the merge gate's business,
        not the verdict's. A check that finished red, or a real content
        finding, still blocks as always.

        ## Quoting convention

        When your prose QUOTES verdict or finding vocabulary -- a prior
        round's "Needs more work", the words blocking, rejected, or
        actionable findings used descriptively, a phrase you are
        discussing rather than declaring -- wrap it in a SINGLE pair of
        backticks (`phrase`). Not a double pair: the instrument blanks
        single-backtick spans only, so a double-backticked quotation
        stays live in the scan and re-blocks the PR anyway
        (ai-config#2449). The repo's fully-clean instrument scans review
        comments for those phrases and cannot tell an unbackticked
        quotation from a standing verdict, so a clean review narrating
        the round it resolved re-blocks its own PR (ai-config#2497,
        measured on #2479 and #2493). Your OWN verdict line stays
        unbackticked.

        ## Prior review context

        The comments below are the last few reviews you (claude[bot]) posted on this PR.
        Before posting your findings, check whether each finding you are about to raise
        was already raised in a prior round. If it was, and the author replied with a
        rebuttal explaining why the code is correct or the finding is a false positive,
        and that thread was resolved — do not re-raise it. Only re-raise if the current
        diff introduces a new instance of the same issue on a different line, or if the
        author's fix is absent from the current diff.

        ${{ needs.gather-context.outputs.prior-reviews }}
