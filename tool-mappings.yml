# Central cross-model tool-mapping registry.
#
# The canonical skills under skills/ are written for Claude Code and name
# concrete tools (mostly `gh`/`git` commands, sometimes `mcp__github__*`).
# This file maps each canonical operation to the tool every supported model
# should reach for, so a wrapper can tell Codex/Copilot/etc. exactly what to
# run instead of "adapt it yourself."
#
# scripts/sync-codex-skill-wrappers.py reads this file, renders the full
# per-model reference at tool-mappings.md, and points every generated Codex
# wrapper at that reference (a wrapper links to tool-mappings.md rather than
# embedding the operations table itself). Edit this file, then run that
# script to regenerate both. CI (`validate`) fails if either is out of sync.

# How each model resolves an operation. Most agents converge on "use the
# GitHub MCP tool when the session has it, otherwise the CLI command" --- only
# the default differs, so we state the rule once here rather than repeating a
# near-identical column per model.
models:
  - id: claude
    label: Claude Code
    resolves: GitHub MCP tool in remote/web sessions; the CLI command locally.
  - id: codex
    label: Codex
    resolves: GitHub MCP tool if the session has it; otherwise the CLI command.
  - id: copilot
    label: VS Code Copilot
    resolves: GitHub MCP tool.
  - id: gemini
    label: Gemini CLI
    resolves: GitHub MCP tool if configured in MCP settings; otherwise the CLI command.
  - id: cli
    label: Generic shell / CLI
    resolves: The CLI command (fallback for any agent that just runs a shell).

# Each operation gives the canonical `gh`/`git` command (the CLI fallback,
# and what the Claude skills are written in) plus the GitHub MCP tool that
# performs the same action. `<N>` is a PR/issue number; `<branch>` a ref.
#
# Quote every operand carrying a `<...>` placeholder. These commands are meant
# to be copy-pasted, and the shell reads a bare `<` as input redirection and a
# bare `>` as output redirection, so an unsubstituted placeholder is eaten by
# the shell rather than passed to the command. Measured 2026-08-19 in bash
# 3.2.57, bash 5.3.15, and zsh 5.9, which agree:
# `gh pr view <N> --comments` reads stdin from a file named `N` and CREATES OR
# TRUNCATES one named `--comments`, leaving `gh pr view` to run with no
# arguments; `gh pr view <N>` with nothing after it is a syntax error, since
# the `>` has no target. Quoting the whole operand (`gh pr view "<N>"`) passes
# the placeholder through literally, so the command fails on the placeholder
# instead of silently redirecting. scripts/validate-skills.py enforces this by
# testing the effect -- any `<` outside quotes in a command field -- rather
# than by matching particular command spellings.
operations:
  - id: VIEW_PR
    description: Read a pull request's details and metadata.
    cli: gh pr view "<N>"
    github_mcp: mcp__github__pull_request_read (method=get)
  - id: LIST_PRS
    description: List pull requests.
    cli: gh pr list
    github_mcp: mcp__github__list_pull_requests
  - id: WHO_AM_I
    description: Resolve the invoking user's login, for the PR-scope filter in `memories/reviewing-prs.md`.
    cli: gh api user --jq .login
    github_mcp: mcp__github__get_me
  - id: SEARCH_PRS
    description: Search pull requests by keyword / query string.
    cli: gh pr list --search "<query>"
    github_mcp: mcp__github__search_pull_requests
  - id: DIFF_PR
    description: Read a pull request's diff.
    cli: gh pr diff "<N>"
    github_mcp: mcp__github__pull_request_read (method=get_diff)
  - id: PR_CHECKS
    description: Read a pull request's CI check / status results.
    cli: gh pr checks "<N>"
    github_mcp: mcp__github__pull_request_read (method=get_check_runs)
  - id: READ_PR_COMMENTS
    description: Read a pull request's top-level (conversation) comments.
    cli: gh pr view "<N>" --comments
    github_mcp: mcp__github__pull_request_read (method=get_comments)
  - id: READ_PR_REVIEW_COMMENTS
    description: Read a pull request's inline review threads. The MCP tool returns thread objects under a `review_threads` key, each with `id` (a `PRRT_` thread node ID for `resolve_thread`), `is_resolved`, `is_outdated`, `is_collapsed`, and a nested `comments` array (wrapping GraphQL `reviewThreads`' camelCase `isResolved`/`isOutdated`). The CLI fallback (`gh api "repos/<owner>/<repo>/pulls/<N>/comments"`) returns flat comment objects without resolution state; inspecting thread resolution via CLI requires a GraphQL `reviewThreads` query.
    cli: gh api "repos/<owner>/<repo>/pulls/<N>/comments"
    github_mcp: mcp__github__pull_request_read (method=get_review_comments)
  - id: READ_PR_REVIEWS
    description: Read a pull request's formal reviews (state per reviewer, e.g. APPROVED / CHANGES_REQUESTED / COMMENTED).
    cli: gh pr view "<N>" --json reviews
    github_mcp: mcp__github__pull_request_read (method=get_reviews)
  - id: REQUEST_COPILOT_REVIEW
    description: Request a GitHub Copilot code review on a pull request.
    cli: gh api "repos/<owner>/<repo>/pulls/<N>/requested_reviewers" -X POST -f "reviewers[]=copilot-pull-request-reviewer[bot]"
    github_mcp: mcp__github__request_copilot_review
  - id: CREATE_PR
    description: Open a new pull request.
    cli: gh pr create
    github_mcp: mcp__github__create_pull_request
  - id: EDIT_PR
    description: Edit a pull request (reviewers, labels, base, etc.).
    cli: gh pr edit "<N>"
    github_mcp: mcp__github__update_pull_request
  - id: MERGE_PR
    description: Merge a pull request.
    cli: gh pr merge "<N>"
    github_mcp: mcp__github__merge_pull_request
  - id: MARK_PR_READY
    description: Flip a draft pull request to ready for review.
    cli: gh pr ready "<N>"
    github_mcp: mcp__github__update_pull_request (draft=false)
  - id: UPDATE_PR_BRANCH
    description: Merge the base branch into a pull request's head branch, pinned to the head that was checked.
    cli: gh api -X PUT "repos/<owner>/<repo>/pulls/<N>/update-branch" -f expected_head_sha="<sha>"
    github_mcp: mcp__github__update_pull_request_branch (expectedHeadSha="<sha>")
  - id: REOPEN_PR
    description: Reopen a closed pull request.
    cli: gh pr reopen "<N>"
    github_mcp: mcp__github__update_pull_request (state=open)
  - id: COMMENT_PR
    description: Post a top-level comment on a pull request. **The body ends with the agent-disclosure marker** --- see [`disclose-agent-authorship`](shared/workflow/disclose-agent-authorship.md).
    cli: gh pr comment "<N>" --body "..."
    github_mcp: mcp__github__add_issue_comment
  - id: REPLY_REVIEW_COMMENT
    description: Reply to an inline pull-request review comment. The path carries the PR number; the id-only route (`PATCH .../pulls/comments/<id>`) EDITS that comment instead. **The body ends with the agent-disclosure marker** --- see [`disclose-agent-authorship`](shared/workflow/disclose-agent-authorship.md).
    cli: gh api -X POST "repos/<owner>/<repo>/pulls/<N>/comments/<id>/replies" -F "body=@<file>"
    github_mcp: mcp__github__add_reply_to_pull_request_comment
  - id: RESOLVE_REVIEW_THREAD
    description: Mark an inline pull-request review thread as resolved.
    cli: gh api graphql -f query='mutation { resolveReviewThread(input:{threadId:"<thread_node_id>"}) { thread { isResolved } } }'
    github_mcp: mcp__github__resolve_review_thread
  - id: WATCH_PR
    description: Subscribe to / unsubscribe from a pull request's activity. Prefer this over WATCH_REPO or LIST_NOTIFICATIONS below where it's available --- it needs no toolset enabled, and targets the PR directly rather than degrading into per-PR polling or a whole-repo subscription.
    cli: (no CLI equivalent)
    github_mcp: mcp__github__subscribe_pr_activity / mcp__github__unsubscribe_pr_activity
  - id: WATCH_REPO
    description: Watch a whole repository's notifications. **Requires the GitHub MCP server's `notifications` toolset, which is off by default.** Coarser than WATCH_PR --- use only when WATCH_PR's tool isn't available (e.g. a local CLI session) and no PR-scoped alternative exists.
    cli: gh api -X PUT "repos/<owner>/<repo>/subscription" -f subscribed=true
    github_mcp: mcp__github__manage_repository_notification_subscription (action=watch)
  - id: LIST_NOTIFICATIONS
    description: List the authenticated user's notifications across every repo, optionally filtered to one repo. One call covers every subscribed thread, which is cheaper than polling N PRs individually and can see a PR another session opened. **Requires the `notifications` toolset, off by default.**
    cli: gh api --paginate notifications
    github_mcp: mcp__github__list_notifications
  - id: MANAGE_NOTIFICATION_SUBSCRIPTION
    description: Watch, ignore, or delete the subscription on a specific notification **thread** (needs a thread/notification id from LIST_NOTIFICATIONS, not a bare PR/issue number --- there is no REST endpoint to subscribe to an arbitrary PR/issue directly without an existing thread). Narrower than WATCH_PR; only useful once a thread already exists (e.g. you were mentioned or already participated). **Requires the `notifications` toolset, off by default.**
    cli: gh api -X PUT "notifications/threads/<thread_id>/subscription" -f subscribed=true
    github_mcp: mcp__github__manage_notification_subscription (action=watch)
  - id: VIEW_ISSUE
    description: Read an issue's details.
    cli: gh issue view "<N>"
    github_mcp: mcp__github__issue_read
  - id: LIST_ISSUES
    description: List issues.
    cli: gh issue list
    github_mcp: mcp__github__list_issues
  - id: SEARCH_ISSUES
    description: Search issues by keyword / query string.
    cli: gh issue list --search "<query>"
    github_mcp: mcp__github__search_issues
  - id: READ_ISSUE_COMMENTS
    description: Read an issue's comments.
    cli: gh issue view "<N>" --comments
    github_mcp: mcp__github__issue_read (method=get_comments)
  - id: ISSUE_LINKED_PRS
    description: List the pull requests cross-referenced from an issue's timeline (i.e. PRs that link or close it).
    cli: gh api --paginate "repos/<owner>/<repo>/issues/<N>/timeline"
    github_mcp: (no GitHub MCP tool; approximate with SEARCH_PRS)
  - id: CREATE_ISSUE
    description: Open a new issue.
    cli: gh issue create
    github_mcp: mcp__github__issue_write (method=create)
  - id: COMMENT_ISSUE
    description: Post a comment on an issue. **The body ends with the agent-disclosure marker** --- see [`disclose-agent-authorship`](shared/workflow/disclose-agent-authorship.md).
    cli: gh issue comment "<N>" --body "..."
    github_mcp: mcp__github__add_issue_comment
  - id: CLOSE_ISSUE
    description: Close an issue with a reason.
    cli: gh issue close "<N>" --reason "..."
    github_mcp: mcp__github__issue_write (method=update, state=closed, state_reason=...)
  - id: REOPEN_ISSUE
    description: Reopen a closed issue. **The body ends with the agent-disclosure marker** --- see [`disclose-agent-authorship`](shared/workflow/disclose-agent-authorship.md).
    cli: gh issue reopen "<N>" --comment "..."
    github_mcp: mcp__github__issue_write (method=update, state=open)
  - id: LABEL_ISSUE
    description: >-
      Set an issue's labels. The two behave differently and are not
      interchangeable: `--add-label` ADDS to the existing set, while the MCP
      path REPLACES the whole set, so pass the union of existing and new
      labels there. The MCP path also silently creates an unknown label name
      instead of rejecting it.
    cli: gh issue edit "<N>" --add-label "..."
    github_mcp: mcp__github__issue_write (method=update, labels=[...])
  - id: GET_LABEL
    description: >-
      Read a single label's name, color, and description. There is no MCP tool
      to create or update a label; use gh label create/edit, or gh api from a
      workflow.
    cli: gh api "repos/<owner>/<repo>/labels/<name>"
    github_mcp: mcp__github__get_label
  - id: LIST_DISCUSSIONS
    description: List a repository's discussions. Readable over REST; writes are GraphQL-only.
    cli: gh api repos/{owner}/{repo}/discussions
    github_mcp: mcp__github__list_discussions
  - id: VIEW_DISCUSSION
    description: Read a discussion topic and its comment thread. Readable over REST.
    cli: gh api repos/{owner}/{repo}/discussions/{number}[/comments]
    github_mcp: mcp__github__get_discussion / mcp__github__get_discussion_comments
  - id: COMMENT_DISCUSSION
    description: Post a reply on a discussion (top-level or threaded). **The body ends with the agent-disclosure marker** --- see [`disclose-agent-authorship`](shared/workflow/disclose-agent-authorship.md).
    cli: gh api graphql (addDiscussionComment)
    github_mcp: mcp__github__discussion_comment_write (method=add|reply)
  - id: ANSWER_DISCUSSION
    description: Mark a comment as the accepted answer on a Q&A discussion.
    cli: gh api graphql (markDiscussionCommentAsAnswer)
    github_mcp: mcp__github__discussion_comment_write (method=mark_answer)
  - id: CREATE_DISCUSSION
    description: Open a new discussion in a category.
    cli: gh api graphql (createDiscussion)
    github_mcp: (no GitHub MCP tool; use gh api graphql)
  - id: CLOSE_DISCUSSION
    description: Close a discussion with a reason (RESOLVED, OUTDATED, DUPLICATE).
    cli: gh api graphql (closeDiscussion)
    github_mcp: (no GitHub MCP tool; use gh api graphql)
  - id: PUSH
    description: Push commits to a branch.
    cli: git push -u origin "<branch>"
    github_mcp: (use git; no GitHub MCP equivalent)
  - id: COMMIT
    description: Record staged changes as a commit.
    cli: git commit -m "..."
    github_mcp: (use git; mcp__github__create_or_update_file commits a single file)
  - id: FETCH
    description: Fetch refs from the remote.
    cli: git fetch origin "<branch>"
    github_mcp: (use git; no GitHub MCP equivalent)
  - id: MERGE_BRANCH
    description: Merge a branch into the current one.
    cli: git merge "origin/<branch>"
    github_mcp: (use git; no GitHub MCP equivalent)
  - id: CREATE_BRANCH
    description: Create a new branch (e.g. off the default branch).
    cli: git switch -c "<branch>" "origin/<base>"
    github_mcp: mcp__github__create_branch
  - id: CREATE_WORKTREE
    description: Create a dedicated worktree on a new branch off the default branch, so parallel sessions never share a checkout (AGENTS.md "Worktree isolation").
    cli: git worktree add "../<repo>-<slug>" -b "<branch>" "origin/<base>"
    github_mcp: (use git; no GitHub MCP equivalent)
  - id: DELETE_REF
    description: Delete a remote branch or tag ref.
    cli: git push origin --delete "<branch>" (or git push origin ":refs/tags/<tag>")
    github_mcp: (no GitHub MCP tool; use gh api -X DELETE "repos/<owner>/<repo>/git/refs/heads/<branch>")
  - id: READ_FILE
    description: Read a file's contents from the repo.
    cli: gh api "repos/<owner>/<repo>/contents/<path>"
    github_mcp: mcp__github__get_file_contents
  - id: LIST_COMMITS
    description: >-
      List a branch's commits (pass the branch or ref as sha, e.g. sha=gh-pages
      to see which build a Pages branch currently serves).
    cli: git log "<branch>" (or gh api "repos/<owner>/<repo>/commits" -f "sha=<branch>")
    github_mcp: mcp__github__list_commits
  - id: WRITE_FILE
    description: Create or update file(s) on a branch in a single commit.
    cli: git add "<path>" && git commit -m "..." && git push
    github_mcp: mcp__github__create_or_update_file (one file) / mcp__github__push_files (multiple)
  - id: LIST_SECRETS
    description: >-
      List a repo's Actions secrets. The value is never readable, so this can
      confirm a secret exists and when it last changed, never what it is or
      whether it works. Use the REST endpoint when created_at is needed:
      `gh secret list --json` offers name, numSelectedRepos, selectedReposURL,
      updatedAt, and visibility (gh 2.96.0), so updatedAt is available from the
      CLI but created_at is not. `--paginate` needs the `--jq '.secrets[]'`
      projection: the endpoint returns an object rather than an array, so a
      bare `--paginate` concatenates one object per page and the result is not
      valid JSON.
    cli: gh api "repos/<owner>/<repo>/actions/secrets" --paginate --jq '.secrets[]'
    github_mcp: (no GitHub MCP tool; use gh api)
  - id: SET_SECRET
    description: >-
      Set an Actions secret. Omit --body so the value is read from stdin,
      keeping it out of argv (visible in ps) and shell history. Exiting 0 means
      the value was stored, not that it is valid.
    cli: gh secret set "<name>" --repo "<owner>/<repo>"
    github_mcp: (no GitHub MCP tool; use gh)
  - id: RUN_WORKFLOW
    description: >-
      Dispatch a workflow_dispatch workflow run on a ref. Pass --ref explicitly;
      omitting it dispatches against the default branch, which is rarely what a
      PR-scoped dispatch wants. The MCP tool's `ref` is required for the same
      reason.
    cli: gh workflow run "<workflow>.yml" --repo "<owner>/<repo>" --ref "<branch>" --field "<key>=<value>"
    github_mcp: mcp__github__actions_run_trigger (method=run_workflow)
  - id: LIST_WORKFLOW_RUNS
    description: List a workflow's recent runs, with conclusion and timestamps.
    cli: gh run list --workflow "<workflow>.yml" --repo "<owner>/<repo>"
    github_mcp: mcp__github__actions_list (method=list_workflow_runs)
  - id: GET_WORKFLOW_RUN
    description: Read a workflow run's details, status, and conclusion.
    cli: gh run view "<run_id>" --repo "<owner>/<repo>" (or gh api "repos/<owner>/<repo>/actions/runs/<run_id>")
    github_mcp: mcp__github__actions_get (method=get_workflow_run)
