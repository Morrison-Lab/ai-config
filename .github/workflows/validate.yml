name: validate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml==6.0.2
      - name: Validate skills & manifests
        run: python3 scripts/validate-skills.py
      - name: Check markdown links
        run: python3 scripts/check-links.py
      - name: Check vendored drift
        run: python3 scripts/check-vendored-drift.py
      - name: Check markdown (.md) style
        run: npx --yes markdownlint-cli2@0.22.1   # node is preinstalled on ubuntu runners; config in .markdownlint-cli2.jsonc
      - name: Run semantic-line-break tool tests
        run: |
          python3 scripts/test_slb.py
          python3 scripts/test_check_new_line_breaks.py
      - name: Run memory-file-size check tests
        run: python3 scripts/test_check_memory_file_size.py
      - name: Check for oversized memory files (advisory)
        # Non-blocking (ai-config#695): memory files are read on demand, so
        # length is a real per-use cost -- but crossing the threshold is a
        # prompt to consider splitting, not a defect that should block an
        # unrelated PR. See the script's docstring for the threshold's
        # rationale.
        run: python3 scripts/check-memory-file-size.py
      - name: Check new markdown lines for missing semantic breaks (advisory)
        # Diff-scoped, non-blocking (ai-config#682): MD013 is off repo-wide
        # (see .markdownlint-cli2.jsonc) because most of the corpus has
        # drifted from the last semantic-line-breaks reformat. This only
        # flags lines this PR itself adds, so it can't reflag that drift.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          python3 scripts/check-new-line-breaks.py --base ${{ github.event.pull_request.base.sha }}
      - name: Check Quarto (.qmd) prose style
        uses: d-morrison/gha/lint-qmd@cba62aa00856c40111cd976d563e1ebe748f3f9a # gha#280
